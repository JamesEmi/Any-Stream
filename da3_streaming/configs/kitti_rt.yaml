Weights:
  model: 'DA3'
  DA3: '/mnt/data/any-stream/any-stream/weights/model.safetensors'
  DA3_CONFIG: '/mnt/data/any-stream/any-stream/weights/config.json'
  SALAD: '/mnt/data/any-stream/any-stream/weights/dino_salad.ckpt'

Model:
  chunk_size: 120
  overlap: 60
  loop_chunk_size: 20
  loop_enable: False
  useDBoW: False
  delete_temp_files: True
  align_lib: 'triton'
  align_method: 'sim3'
  scale_compute_method: 'auto'
  align_type: 'dense'

  ref_view_strategy: 'middle'
  ref_view_strategy_loop: 'saddle_balanced'
  depth_threshold: 15.0

  save_depth_conf_result: False
  save_debug_info: False

  Sparse_Align:
    keypoint_select: 'orb'
    keypoint_num: 5000

  IRLS:
    delta: 0.1
    max_iters: 5
    tol: 1e-9

  Pointcloud_Save:
    sample_ratio: 0.015
    conf_threshold_coef: 0.75
    use_conf_filtering: True

Loop:
  SALAD:
    image_size: [336, 336]
    batch_size: 32
    similarity_threshold: 0.85
    top_k: 5
    use_nms: True
    nms_threshold: 25

  SIM3_Optimizer:
    lang_version: 'python'
    max_iterations: 30
    lambda_init: 1e-6

GPS_PGO:
  enabled: true
  use_skip_constraints: true       # drift correction: every k-th chunk pair
  skip_k: 5                        # add constraint every k chunks
  use_proximity_constraints: true   # loop closure: spatially close chunks
  proximity_threshold: 1.0        # meters, "same place" threshold
  min_gap: 5                       # minimum chunk gap for proximity pairs
