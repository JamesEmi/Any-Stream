Weights:
  model: 'VGGT_OMEGA' # DA3, MapAnything, VGGT or VGGT_OMEGA
  DA3: '/mnt/data/any-stream/any-stream/weights/model.safetensors'
  DA3_CONFIG: '/mnt/data/any-stream/any-stream/weights/config.json'
  SALAD: '/mnt/data/any-stream/any-stream/weights/dino_salad.ckpt'

Model:
  chunk_size: 30
  overlap: 10
  loop_chunk_size: 20
  loop_enable: False
  useDBoW: False
  delete_temp_files: True
  align_lib: 'triton'
  align_method: 'sim3'
  scale_compute_method: 'auto'
  align_type: 'dense'

  ref_view_strategy: 'saddle_balanced'
  ref_view_strategy_loop: 'saddle_balanced'
  depth_threshold: 15.0

  save_depth_conf_result: True
  save_debug_info: False

  inject_pred_intrinsics: true   # chunk 0's median K reused as prior for all later chunks (MA only)

  Sparse_Align:
    keypoint_select: 'orb'
    keypoint_num: 5000

  IRLS:
    delta: 0.1
    max_iters: 5
    tol: 1e-9

  Pointcloud_Save:
    sample_ratio: 1.0
    conf_threshold_coef: 0.75
    use_conf_filtering: False   # MapAnything → mask-based filtering

Loop:
  SALAD:
    image_size: [336, 336]
    batch_size: 32
    similarity_threshold: 0.85
    top_k: 5
    use_nms: True
    nms_threshold: 25

  SIM3_Optimizer:
    lang_version: 'python'
    max_iterations: 30
    lambda_init: 1e-6
    gps_sigma_t: 0.01    # GPS unary fallback σ (m)
    # seq_sigma = joint rot/trans fallback; seq_sigma_R / seq_sigma_t override when set.
    # Split lets us weld rotation to VO while keeping translation GPS-correctable.
    seq_sigma: 0.1
    # No GT for this dataset, so we can't tune seq_sigma_R to pure-VO ROE the way
    # we can on KITTI. 0.01 (≈0.5°) keeps rotation tight but not welded — conservative
    # against potential MapAnything rotation drift we can't measure directly.
    # Validate by pointcloud consistency at chunk boundaries, not metric ROE.
    seq_sigma_R: 0.01
    seq_sigma_t: 0.05
    heading_sigma: 0.1
    scale_bw_sigma: 0.05
    scale_prior_sigma: 0.0

GPS_PGO:
  enabled: true
  method: 'pgo'
  gps_anchor_freq: 1          # one 5-DOF factor every N frames
  gps_cov_isotropic: true     # true → ignore sensor cov, use gps_sigma_t
  use_start_prior: false
