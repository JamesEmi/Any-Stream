# WARNING: This is a TEMPLATE ONLY. The final config lives in ${AIRLAB_PATH}/config/reid/anystream
Weights:
  model: 'DA3' # DA3 or MapAnything
  DA3: '/mnt/data/any-stream/any-stream/weights/model.safetensors'
  DA3_CONFIG: '/mnt/data/any-stream/any-stream/weights/config.json'
  SALAD: '/mnt/data/any-stream/any-stream/weights/dino_salad.ckpt'

Model:
  chunk_size: 16
  overlap: 4
  loop_chunk_size: 5 # imgs of loop chunk = 2 * loop_chunk_size
  loop_enable: False # True
  useDBoW: False
  delete_temp_files: True
  align_lib: 'triton' # choose among 'triton' (GPU), 'torch' (GPU), 'numba' (CPU) or 'numpy' (CPU)
  align_method: 'sim3' # choose among 'sim3', 'se3' or 'scale+se3'
  scale_compute_method: 'auto' # choose among 'auto', 'ransac' or 'weighted'. It is used when align_method == 'scale+se3'
  align_type: 'dense' # choose between 'dense' or 'sparse'. Sparse align is constructing, not avaible for now

  ref_view_strategy: 'saddle_balanced' # 'middle', 'saddle_balanced', 'first' or 'saddle_sim_range'
  ref_view_strategy_loop: 'saddle_balanced' # 'middle', 'saddle_balanced', 'first' or 'saddle_sim_range'
  depth_threshold: 15.0

  save_depth_conf_result: True
  save_debug_info: False

  Sparse_Align:
    keypoint_select: 'orb' # choose among 'orb', 'fast' or 'disk'
    keypoint_num: 5000

  IRLS:
    delta: 0.1
    max_iters: 5
    tol: 1e-9

  Pointcloud_Save:
    sample_ratio: 0.015
    conf_threshold_coef: 0.75 # conf_threshold = np.mean(confs) * conf_threshold_coef
    use_conf_filtering: True # If False, use mask-based filtering (for MapAnything)

Loop:
  SALAD:
    image_size: [336, 336]
    batch_size: 32
    similarity_threshold: 0.85
    top_k: 5
    use_nms: True
    nms_threshold: 25

  SIM3_Optimizer:
    lang_version: 'cpp'
    # choose between 'cpp' or 'python'. will auto set 'python' if c++ version has not installed
    max_iterations: 30
    lambda_init: 1e-6
    gps_sigma_t: 1.0      # isotropic GPS unary sigma (m); match the sensor's real accuracy
    heading_sigma: 0.3    # GPS heading factor sigma
    seq_sigma: 0.1        # sequential (odometry) edge fallback
    seq_sigma_R: 0.01     # rotation tight to VO; translation stays GPS-correctable

# GPS pose-graph optimisation. Without this block the mapping node silently keeps
# the rigid Umeyama alignment, which cannot correct drift. Pure gtsam - unaffected
# by SIM3_Optimizer.lang_version above (that is the loop-closure solver only).
GPS_PGO:
  enabled: true
  method: 'pgo'
  gps_every_k: 1            # solve every chunk; raise if solve time grows
  gps_anchor_freq: 1        # one 5-DOF factor every N frames
  gps_cov_isotropic: true   # ignore per-sample covariance, use gps_sigma_t
  use_start_prior: false
  max_solve_seconds: 5.0    # log a warning past this
